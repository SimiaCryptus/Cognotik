<!DOCTYPE html>
<html lang="en" data-theme="auto" data-accent="indigo" data-density="comfortable">
<head>
    <meta charset="utf-8">
     <!-- interactive-widget: the on-screen keyboard resizes the layout instead
          of scrolling the (overflow:hidden) shell out of view. -->
     <meta name="viewport"
           content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1217" media="(prefers-color-scheme: dark)">
    <title>Files</title>

    <!-- Optional web fonts: the token stack degrades to the platform UI font. -->
    <link rel="preconnect" href="https://rsms.me" crossorigin>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" media="all" onerror="this.remove()">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.min.css"
          media="all" onerror="this.remove()">

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="/modules/theme.js" onerror="window.__fsNoThemeManager=true"></script>
    <script>
        /* Paint the persisted appearance before first layout: no theme flash. */
        (function () {
            try {
                var raw = null;
                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (key && key.indexOf('cognotik.fs.ui.v1:') === 0 && key.indexOf(':global:') < 0) {
                        raw = localStorage.getItem(key);
                    }
                }
                var record = raw ? JSON.parse(raw) : null;
                var root = document.documentElement;
                if (record && record.theme) root.setAttribute('data-theme', record.theme);
                if (record && record.accent) root.setAttribute('data-accent', record.accent);
                if (record && record.layout && record.layout.density) {
                    root.setAttribute('data-density', record.layout.density);
                }
            } catch (e) { /* first run, or storage denied */
            }
        })();
    </script>
</head>
<body>
<a class="fs-skip" href="#fs-explorer">Skip to explorer</a>
<a class="fs-skip" href="#fs-editor">Skip to editor</a>

<div id="fs-root" class="fs-shell" aria-busy="true">
    <p class="fs-boot" role="status">
        <span class="fs-boot__spinner" aria-hidden="true"></span>
        <span class="fs-boot__text">Loading workspace…</span>
    </p>
</div>

<noscript>
    <p>This view needs JavaScript.
        <a href="../files/root/">Use the classic file browser</a> instead.</p>
</noscript>

<script type="module" src="app/main.js"></script>
</body>
</html>
