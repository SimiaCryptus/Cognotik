<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ω Omega — AI-Powered DocOps App Generator</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Animated background gradient */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 50%, rgba(56, 30, 114, 0.4) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 50%, rgba(20, 60, 120, 0.3) 0%, transparent 60%),
                        radial-gradient(ellipse at 50% 80%, rgba(100, 40, 80, 0.2) 0%, transparent 50%);
            animation: bgShift 12s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes bgShift {
            0% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.8; transform: scale(1); }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(140, 120, 255, 0.5);
            border-radius: 50%;
            animation: float linear infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-duration: 18s; animation-delay: 0s; width: 3px; height: 3px; }
        .particle:nth-child(2) { left: 25%; animation-duration: 22s; animation-delay: -3s; width: 5px; height: 5px; background: rgba(100, 180, 255, 0.4); }
        .particle:nth-child(3) { left: 40%; animation-duration: 16s; animation-delay: -7s; width: 3px; height: 3px; }
        .particle:nth-child(4) { left: 55%; animation-duration: 20s; animation-delay: -2s; width: 6px; height: 6px; background: rgba(180, 100, 255, 0.3); }
        .particle:nth-child(5) { left: 70%; animation-duration: 24s; animation-delay: -5s; width: 4px; height: 4px; }
        .particle:nth-child(6) { left: 85%; animation-duration: 19s; animation-delay: -8s; width: 3px; height: 3px; background: rgba(100, 200, 200, 0.4); }
        .particle:nth-child(7) { left: 15%; animation-duration: 21s; animation-delay: -4s; width: 5px; height: 5px; background: rgba(200, 140, 255, 0.3); }
        .particle:nth-child(8) { left: 60%; animation-duration: 17s; animation-delay: -6s; width: 4px; height: 4px; }
        .particle:nth-child(9) { left: 35%; animation-duration: 23s; animation-delay: -1s; width: 3px; height: 3px; background: rgba(140, 200, 255, 0.4); }
        .particle:nth-child(10) { left: 80%; animation-duration: 15s; animation-delay: -9s; width: 5px; height: 5px; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Main content container */
        .splash-container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            padding: 3rem;
            animation: fadeInUp 1.5s ease-out;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Omega symbol */
        .omega-symbol {
            font-size: 8rem;
            font-weight: 300;
            line-height: 1;
            background: linear-gradient(135deg, #8b5cf6, #6366f1, #3b82f6, #8b5cf6);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 6s ease-in-out infinite;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 30px rgba(99, 102, 241, 0.4));
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Title */
        .title {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #f0f0f0;
            margin-bottom: 0.75rem;
            text-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
        }

        /* Subtitle */
        .subtitle {
            font-size: 1.35rem;
            font-weight: 400;
            color: #a0a0c0;
            margin-bottom: 2.5rem;
            letter-spacing: 0.05em;
        }

        /* Divider line */
        .divider {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #6366f1, transparent);
            margin: 0 auto 2.5rem;
            border-radius: 1px;
        }

        /* Feature pills */
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .feature-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 999px;
            font-size: 0.95rem;
            color: #c0c0e0;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            animation: pillFadeIn 0.8s ease-out backwards;
        }

        .feature-pill:nth-child(1) { animation-delay: 0.8s; }
        .feature-pill:nth-child(2) { animation-delay: 1.0s; }
        .feature-pill:nth-child(3) { animation-delay: 1.2s; }
        .feature-pill:nth-child(4) { animation-delay: 1.4s; }
        .feature-pill:nth-child(5) { animation-delay: 1.6s; }

        @keyframes pillFadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .feature-pill:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.2);
        }

        .feature-pill .icon {
            font-size: 1.1rem;
        }

        /* Pipeline flow diagram */
        .pipeline-flow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
            animation: fadeInUp 1.2s ease-out 1.8s backwards;
        }

        .pipeline-step {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            background: rgba(30, 30, 60, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 8px;
            font-size: 0.85rem;
            color: #b0b0d0;
            white-space: nowrap;
        }

        .pipeline-arrow {
            color: #6366f1;
            font-size: 1.2rem;
            animation: arrowPulse 2s ease-in-out infinite;
        }

        .pipeline-arrow:nth-child(2) { animation-delay: 0.3s; }
        .pipeline-arrow:nth-child(4) { animation-delay: 0.6s; }
        .pipeline-arrow:nth-child(6) { animation-delay: 0.9s; }

        @keyframes arrowPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Demo badge */
        .demo-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            font-size: 1.1rem;
            color: #d0d0f0;
            letter-spacing: 0.05em;
            animation: fadeInUp 1s ease-out 2.2s backwards;
        }

        .demo-badge .dot {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: recBlink 1.5s ease-in-out infinite;
        }

        @keyframes recBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Powered by footer */
        .powered-by {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: #606080;
            letter-spacing: 0.1em;
            z-index: 10;
            animation: fadeInUp 1s ease-out 2.5s backwards;
        }

        .powered-by strong {
            color: #8080a0;
            font-weight: 600;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .omega-symbol { font-size: 5rem; }
            .title { font-size: 2rem; }
            .subtitle { font-size: 1.1rem; }
            .splash-container { padding: 2rem 1.5rem; }
            .pipeline-flow { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="splash-container">
        <div class="omega-symbol">Ω</div>
        <h1 class="title">Omega</h1>
        <p class="subtitle">AI-Powered DocOps App Generator</p>

        <div class="divider"></div>

        <div class="features">
            <span class="feature-pill"><span class="icon">💡</span> Describe Your Idea</span>
            <span class="feature-pill"><span class="icon">📋</span> Auto-Generate Requirements</span>
            <span class="feature-pill"><span class="icon">⚙️</span> Build Pipeline Ops</span>
            <span class="feature-pill"><span class="icon">🎨</span> Generate Full UI</span>
            <span class="feature-pill"><span class="icon">🔄</span> Iterate & Refine</span>
        </div>

        <div class="pipeline-flow">
            <div class="pipeline-step">💡 Idea</div>
            <span class="pipeline-arrow">→</span>
            <div class="pipeline-step">📋 Requirements</div>
            <span class="pipeline-arrow">→</span>
            <div class="pipeline-step">⚙️ Pipeline</div>
            <span class="pipeline-arrow">→</span>
            <div class="pipeline-step">🎨 App</div>
        </div>

        <div class="demo-badge">
            <span class="dot"></span>
            Automated Demo Walkthrough
        </div>
    </div>

    <div class="powered-by">
        Powered by <strong>Cognotik DocOps Platform</strong>
    </div>

</body>
</html>
