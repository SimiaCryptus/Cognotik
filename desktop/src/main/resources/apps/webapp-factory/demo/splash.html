<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webapp Builder — Demo</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0f1117;
            color: #e2e8f0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }

        .splash-icon {
            font-size: 96px;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 32px rgba(108, 140, 255, 0.4));
        }

        .splash-title {
            font-size: 52px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #6c8cff 0%, #38bdf8 50%, #4ade80 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .splash-subtitle {
            font-size: 22px;
            color: #94a3b8;
            font-weight: 400;
            margin-bottom: 40px;
        }

        .splash-badge {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #f59e42;
            border: 1px solid rgba(245, 158, 66, 0.3);
            background: rgba(245, 158, 66, 0.08);
            animation: pulse-badge 2s ease-in-out infinite;
        }

        .splash-features {
            display: flex;
            gap: 32px;
            justify-content: center;
            margin-top: 48px;
            flex-wrap: wrap;
        }

        .feature-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 12px;
            background: rgba(108, 140, 255, 0.08);
            border: 1px solid rgba(108, 140, 255, 0.15);
            font-size: 15px;
            color: #cbd5e1;
            animation: fadeInUp 1s ease-out both;
        }

        .feature-pill:nth-child(1) { animation-delay: 0.6s; }
        .feature-pill:nth-child(2) { animation-delay: 0.8s; }
        .feature-pill:nth-child(3) { animation-delay: 1.0s; }
        .feature-pill:nth-child(4) { animation-delay: 1.2s; }

        .feature-pill .icon {
            font-size: 20px;
        }

        /* Decorative background elements */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }

        .bg-glow.glow-1 {
            width: 500px;
            height: 500px;
            background: #6c8cff;
            top: -150px;
            right: -100px;
            animation: drift 8s ease-in-out infinite alternate;
        }

        .bg-glow.glow-2 {
            width: 400px;
            height: 400px;
            background: #4ade80;
            bottom: -100px;
            left: -80px;
            animation: drift 10s ease-in-out infinite alternate-reverse;
        }

        .bg-glow.glow-3 {
            width: 300px;
            height: 300px;
            background: #f59e42;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: drift 6s ease-in-out infinite alternate;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }

        @keyframes pulse-badge {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.6; }
        }

        @keyframes drift {
            from { transform: translate(0, 0); }
            to   { transform: translate(30px, -20px); }
        }
    </style>
</head>
<body>

    <!-- Background glows -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="bg-glow glow-3"></div>

    <div class="splash-container">
        <div class="splash-icon">🏗️</div>
        <h1 class="splash-title">Webapp Builder</h1>
        <p class="splash-subtitle">AI-Powered Web Application Factory</p>
        <span class="splash-badge">▶ Automated Demo</span>

        <div class="splash-features">
            <div class="feature-pill">
                <span class="icon">💡</span>
                <span>Describe Your Idea</span>
            </div>
            <div class="feature-pill">
                <span class="icon">⚙️</span>
                <span>AI Build Pipeline</span>
            </div>
            <div class="feature-pill">
                <span class="icon">🚀</span>
                <span>Live Preview &amp; Launch</span>
            </div>
            <div class="feature-pill">
                <span class="icon">📦</span>
                <span>Git &amp; Download</span>
            </div>
        </div>
    </div>

    <script>
        // Prime TTS voices so they're ready when the demo starts narrating
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            // Some browsers need a small utterance to fully initialize
            const primer = new SpeechSynthesisUtterance('');
            primer.volume = 0;
            window.speechSynthesis.speak(primer);
        }
    </script>
</body>
</html>
