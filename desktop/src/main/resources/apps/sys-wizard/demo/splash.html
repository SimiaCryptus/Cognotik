<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Wizard — Demo</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }

        .splash-icon {
            font-size: 96px;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(136, 96, 208, 0.5));
        }

        .splash-title {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 40%, #6d28d9 70%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .splash-subtitle {
            font-size: 22px;
            font-weight: 400;
            color: #8b949e;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        .splash-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #c4b5fd;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .splash-features {
            display: flex;
            gap: 32px;
            justify-content: center;
            margin-top: 48px;
            flex-wrap: wrap;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0;
            animation: slideUp 0.6s ease-out forwards;
        }

        .feature-item:nth-child(1) { animation-delay: 0.8s; }
        .feature-item:nth-child(2) { animation-delay: 1.1s; }
        .feature-item:nth-child(3) { animation-delay: 1.4s; }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 4px;
        }

        .feature-label {
            font-size: 14px;
            color: #8b949e;
            font-weight: 500;
        }

        /* Decorative background particles */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.08);
            animation: drift linear infinite;
        }

        .particle:nth-child(1) {
            width: 300px; height: 300px;
            top: -100px; left: -50px;
            animation-duration: 20s;
        }
        .particle:nth-child(2) {
            width: 200px; height: 200px;
            top: 60%; right: -80px;
            animation-duration: 25s;
            animation-delay: -5s;
        }
        .particle:nth-child(3) {
            width: 150px; height: 150px;
            bottom: -50px; left: 40%;
            animation-duration: 18s;
            animation-delay: -10s;
        }
        .particle:nth-child(4) {
            width: 250px; height: 250px;
            top: 20%; right: 20%;
            background: rgba(124, 58, 237, 0.05);
            animation-duration: 22s;
            animation-delay: -3s;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes drift {
            0%   { transform: translate(0, 0) rotate(0deg); }
            25%  { transform: translate(30px, -20px) rotate(90deg); }
            50%  { transform: translate(-10px, 20px) rotate(180deg); }
            75%  { transform: translate(-30px, -10px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* Terminal-style blinking cursor after subtitle */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 22px;
            background: #7c3aed;
            margin-left: 4px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="splash-container">
        <div class="splash-icon">🧙</div>
        <h1 class="splash-title">System Wizard</h1>
        <p class="splash-subtitle">
            Describe a goal in plain language — get a working shell script, automatically generated and fixed by AI.<span class="cursor"></span>
        </p>
        <span class="splash-badge">Automated Demo</span>

        <div class="splash-features">
            <div class="feature-item">
                <span class="feature-icon">📋</span>
                <span class="feature-label">Define Goal</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">⚙️</span>
                <span class="feature-label">Generate Script</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🔄</span>
                <span class="feature-label">Run &amp; Auto-Fix</span>
            </div>
        </div>
    </div>
</body>
</html>
