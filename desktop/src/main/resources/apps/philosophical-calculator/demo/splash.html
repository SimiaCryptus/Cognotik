<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philosophical Calculator — Demo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e0e0e0;
    overflow: hidden;
  }

  /* Animated background particles */
  .bg-particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .bg-particles span {
    position: absolute;
    display: block;
    width: 6px;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 50%;
    animation: float linear infinite;
  }
  .bg-particles span:nth-child(1)  { left:  5%; width: 8px;  height: 8px;  animation-duration: 18s; animation-delay: 0s;   }
  .bg-particles span:nth-child(2)  { left: 15%; width: 4px;  height: 4px;  animation-duration: 22s; animation-delay: 2s;   }
  .bg-particles span:nth-child(3)  { left: 25%; width: 6px;  height: 6px;  animation-duration: 16s; animation-delay: 4s;   }
  .bg-particles span:nth-child(4)  { left: 35%; width: 10px; height: 10px; animation-duration: 20s; animation-delay: 1s;   }
  .bg-particles span:nth-child(5)  { left: 45%; width: 5px;  height: 5px;  animation-duration: 24s; animation-delay: 3s;   }
  .bg-particles span:nth-child(6)  { left: 55%; width: 7px;  height: 7px;  animation-duration: 17s; animation-delay: 5s;   }
  .bg-particles span:nth-child(7)  { left: 65%; width: 4px;  height: 4px;  animation-duration: 21s; animation-delay: 0.5s; }
  .bg-particles span:nth-child(8)  { left: 75%; width: 9px;  height: 9px;  animation-duration: 19s; animation-delay: 2.5s; }
  .bg-particles span:nth-child(9)  { left: 85%; width: 5px;  height: 5px;  animation-duration: 23s; animation-delay: 1.5s; }
  .bg-particles span:nth-child(10) { left: 92%; width: 6px;  height: 6px;  animation-duration: 15s; animation-delay: 4.5s; }

  @keyframes float {
    0%   { transform: translateY(100vh) rotate(0deg);   opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-10vh) rotate(720deg);  opacity: 0; }
  }

  /* Main card */
  .splash-card {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 720px;
    padding: 60px 50px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
    animation: cardEntry 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes cardEntry {
    0%   { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Icon */
  .splash-icon {
    font-size: 64px;
    margin-bottom: 16px;
    animation: iconPulse 3s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes iconPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.08); }
  }

  /* Title */
  .splash-title {
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #f5f5f5 0%, #a78bfa 50%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleEntry 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
  }
  @keyframes titleEntry {
    0%   { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Subtitle */
  .splash-subtitle {
    font-size: 1.15rem;
    color: rgba(255, 255, 255, 0.55);
    font-weight: 400;
    margin-bottom: 36px;
    animation: subtitleEntry 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
  }
  @keyframes subtitleEntry {
    0%   { opacity: 0; transform: translateY(15px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Divider */
  .splash-divider {
    width: 80px;
    height: 2px;
    margin: 0 auto 32px;
    background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.5), transparent);
    animation: subtitleEntry 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both;
  }

  /* Feature pills */
  .splash-features {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 36px;
    animation: featuresEntry 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1s both;
  }
  @keyframes featuresEntry {
    0%   { opacity: 0; transform: translateY(15px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.7);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    transition: background 0.3s, color 0.3s;
  }
  .pill:hover {
    background: rgba(167, 139, 250, 0.15);
    color: #c4b5fd;
  }
  .pill-icon {
    font-size: 1rem;
  }

  /* Bottom tagline */
  .splash-footer {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.3);
    animation: subtitleEntry 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1.2s both;
  }
  .splash-footer span {
    color: rgba(167, 139, 250, 0.6);
  }
</style>
</head>
<body>

<div class="bg-particles">
  <span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="splash-card">
  <div class="splash-icon">🧮</div>
  <h1 class="splash-title">Philosophical Calculator</h1>
  <p class="splash-subtitle">AI-powered writing pipeline — from raw notes to polished, multi-perspective essays</p>
  <div class="splash-divider"></div>
  <div class="splash-features">
    <span class="pill"><span class="pill-icon">📝</span> Draft Articles</span>
    <span class="pill"><span class="pill-icon">🔍</span> Multi-Lens Analysis</span>
    <span class="pill"><span class="pill-icon">⚡</span> Dialectical Critique</span>
    <span class="pill"><span class="pill-icon">🎨</span> AI Illustration</span>
    <span class="pill"><span class="pill-icon">🔄</span> Iterative Refinement</span>
    <span class="pill"><span class="pill-icon">📊</span> Usage Tracking</span>
  </div>
  <p class="splash-footer">Powered by <span>SimiaCryptus Skyenet</span></p>
</div>

</body>
</html>
