<!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8"/>
        <link href="/favicon.svg" rel="icon"/>
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <link href="welcome.css" rel="stylesheet">
        <title>Cognotik - Sign In</title>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            body {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                 width: 100%;
                 overflow-x: hidden;
            }
             /* Animated gradient background behind the splash */
             .login-splash {
                 position: relative;
                 background: linear-gradient(
                     135deg,
                     rgba(99, 102, 241, 0.08),
                     rgba(236, 72, 153, 0.08),
                     rgba(14, 165, 233, 0.08),
                     rgba(99, 102, 241, 0.08)
                 );
                 background-size: 400% 400%;
                 animation: gradientShift 12s ease infinite;
             }
             @keyframes gradientShift {
                 0%   { background-position: 0% 50%; }
                 50%  { background-position: 100% 50%; }
                 100% { background-position: 0% 50%; }
             }
            .login-splash {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 40px 20px;
                 width: 100%;
                 box-sizing: border-box;
            }
             .login-splash > * {
                 max-width: 640px;
                 width: 100%;
             }
            .login-splash .logo {
                width: 96px;
                height: 96px;
                margin-bottom: 20px;
                 animation:
                     logoFloat 3s ease-in-out infinite,
                     logoPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
                 filter: drop-shadow(0 6px 16px rgba(99, 102, 241, 0.35));
             }
             @keyframes logoFloat {
                 0%, 100% { transform: translateY(0) rotate(0deg); }
                 50%      { transform: translateY(-8px) rotate(-2deg); }
             }
             @keyframes logoPop {
                 0%   { transform: scale(0.6) rotate(-15deg); opacity: 0; }
                 100% { transform: scale(1)   rotate(0deg);   opacity: 1; }
            }
            .login-splash h1 {
                font-size: 2.5em;
                margin: 0 0 10px 0;
                 background: linear-gradient(90deg, #6366f1, #ec4899, #0ea5e9, #6366f1);
                 background-size: 300% 100%;
                 -webkit-background-clip: text;
                 background-clip: text;
                 -webkit-text-fill-color: transparent;
                 color: transparent;
                 animation:
                     shimmer 6s linear infinite,
                     fadeUp 0.8s ease-out 0.1s both;
             }
             @keyframes shimmer {
                 0%   { background-position: 0% 50%; }
                 100% { background-position: 300% 50%; }
            }
            .login-splash p {
                font-size: 1.1em;
                margin: 0 0 30px 0;
                opacity: 0.8;
                 animation: fadeUp 0.8s ease-out 0.25s both;
             }
             @keyframes fadeUp {
                 0%   { opacity: 0; transform: translateY(12px); }
                 100% { opacity: 0.8; transform: translateY(0); }
             }
             /* Animated spinner */
             .login-splash .spinner {
                 width: 44px;
                 height: 44px;
                 border-radius: 50%;
                 border: 3px solid rgba(99, 102, 241, 0.2);
                 border-top-color: #6366f1;
                 border-right-color: #ec4899;
                 animation:
                     spin 0.9s linear infinite,
                     fadeUp 0.8s ease-out 0.4s both;
            }
             @keyframes spin {
                 to { transform: rotate(360deg); }
             }
            .login-fallback {
                margin-top: 20px;
                font-size: 0.95em;
                 animation: fadeUp 0.8s ease-out 0.55s both;
             }
             .login-fallback a {
                 position: relative;
                 text-decoration: none;
                 color: #6366f1;
                 transition: color 0.2s ease;
             }
             .login-fallback a::after {
                 content: '';
                 position: absolute;
                 left: 0;
                 bottom: -2px;
                 width: 100%;
                 height: 2px;
                 background: linear-gradient(90deg, #6366f1, #ec4899);
                 transform: scaleX(0);
                 transform-origin: left;
                 transition: transform 0.3s ease;
             }
             .login-fallback a:hover {
                 color: #ec4899;
             }
             .login-fallback a:hover::after {
                 transform: scaleX(1);
             }
             /* Respect users who prefer no motion */
             @media (prefers-reduced-motion: reduce) {
                 .login-splash,
                 .login-splash .logo,
                 .login-splash h1,
                 .login-splash p,
                 .login-splash .spinner,
                 .login-fallback {
                     animation: none !important;
                 }
            }
        </style>
    </head>
    <body>

    <div class="login-splash">
        <img alt="Cognotik Logo" class="logo" src="logo.svg">
        <h1>Cognotik</h1>
        <p>Redirecting you to sign in…</p>
        <div class="spinner" role="status" aria-label="Loading"></div>
        <div class="login-fallback">
            If you are not redirected automatically,
            <a id="login-link" href="/login/">click here to sign in</a>.
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <img alt="Cognotik Logo" class="footer-logo" height="24" src="logo.svg" width="24">
            <p>Cognotik &copy; 2026 SimiaCryptus Software</p>
        </div>
    </footer>

    <script>
        (function () {
            var STORAGE_KEY = 'cognotik-theme';
            var root = document.documentElement;
            var saved = localStorage.getItem(STORAGE_KEY) || 'auto';
            if (saved !== 'auto') {
                root.setAttribute('data-theme', saved);
            }
        })();
        (function () {
            var target = '/login/';
            setTimeout(function () {
                window.location.replace(target);
             }, 500);
        })();
    </script>

    </body>
    </html>
