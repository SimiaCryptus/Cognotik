    <title>Cognotik — theme designer harness</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #15181f;
            color: #e8ecf3;
            font: 14px/1.4 system-ui, sans-serif;
        }

        point-cad {
            display: block;
            width: 100%;
            height: 100%;
        }

        #boot-error {
            display: none;
            margin: 20px;

<script type="module">

    try {
        const {bootHarness} = await import(HARNESS_URL);
        await bootHarness(document.getElementById('cad'));
    } catch (err) {
        const el = document.getElementById('boot-error');
        el.style.display = 'block';
        el.textContent =
            'Could not load the theme-designer harness from "' +
            HARNESS_URL +
            '".\n' +
            'Edit HARNESS_URL at the bottom of this file to point at\n' +
            'extensions/theme/ui/harness.js, then reload.\n\n' +
            err;
