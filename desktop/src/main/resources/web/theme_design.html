            "relations": "| rule | tokens | evidence (light / dark) | status |\n|---|---|---|---|\n| dL canvas surface = stepL | canvas, surface | +0.028 / +0.052 | holds (locked per-theme var) |\n| dL surface surfaceAlt = altStep | surface, surfaceAlt | −0.016 / +0.038 | holds |\n| lock H canvas surface surfaceAlt | | 255,–,247 / 266,270,272 | holds (near-neutral, weight 0.3) |\n| dL canvas border = borderStep | | −0.056 / +0.127 | holds |\n| lock H/C coolGray border borderStrong | | H 258/248, C .006/.013 | holds within ±10°, ±0.007 |\n| contrast borderStrong canvas >= strongFloor | | 1.4 / 1.8 | **floor the CSS fails**; stark raises floor to 7 / 10 so strong > decorative |\n| L text = textL; contrast text canvas >= textFloor | | 11.6 / 15.5 | holds |\n| lock C/H ink text textMuted | | C≈0 both | new hue lock (muted hue drifted to ~357°) |\n| contrast textMuted canvas >= mutedC | | 3.2 / 6.9 | **fails in light**; stark uses 7 |\n| lock H brand heading | | 245 vs 254 | holds (C<0.05) |\n| contrast heading canvas >= textFloor | | 10.4 / 15.5 | holds |\n| dL/dC brand brandHover = hoverL/hoverC | | −0.069 / −0.013 | holds, both themes |\n| contrast link canvas >= 4.5 | | 2.9 / 5.6 | **fails in light** (also nordLight) |\n| dL/dC danger dangerHover = dangerHoverL/C | | −0.086 / −0.012 | holds |\n| L secondary; dL secondary secondaryHover | | 0.715→0.624 / 0.452→0.522 | holds (sign flips via var) |\n| anchors accent/warning/success | | fixed status colours per palette | design decision |\n| theme tag (light)/(dark) = VARIANTS[v].scheme | all 12 | themes.js sanity check | must hold — palettes mix variants |",
            "expected": "Light block (illustrative):\n\n```css\n:root {\n  --color-canvas: oklch(97.2% 0.003 255);\n  --color-surface: oklch(100% 0 0);\n  --color-surface-alt: oklch(98.4% 0.002 247);\n  --color-border: oklch(91.6% 0.006 252);\n  --color-border-strong: oklch(~58% 0.01 252);\n  --color-text: oklch(32.1% 0 0);\n  --color-heading: oklch(35.5% 0.044 245);\n  --color-text-muted: oklch(~55% 0 0);\n  --color-brand: oklch(64.6% 0.135 245);\n  --color-brand-hover: oklch(57.7% 0.122 245);\n  --color-link: oklch(~52% 0.135 245);\n  ...\n}\n```\n\nExpect: `link` and `text-muted` darker than today (contrast floors), `border-strong` much darker (3:1 floor) — dark theme lightens it to ~L 52%. Dark `link` equals `brand`; dark `text` ≈ L 91% neutral.\n\nSanity checks for **all 12** blocks after re-solving:\n- log shows `0 unmet`;\n- every L in [0, 1], every C ≤ ~0.25 (no `brand-hover`/`link`/`heading` chroma blow-ups);\n- `brand-hover` and `link` share the brand hue; `heading` is brand-tinted;\n- `text-muted` hue follows `ink`, not ~357°;\n- stark: `border-strong` is stronger than `border` in both schemes.",

            "plumbing": "1. The emitter writes **`themes.css`** (generated — never hand-edit). Link it **before** `style.css` in every page: `<link href=\"/themes.css\" rel=\"stylesheet\">` (this is `STYLESHEET` in `themes.js`).\n2. Load `themes.js` **before** `modules/theme.js`; theme.js reads `window.CognotikThemes`.\n3. theme.js sets `data-theme` from `resolveAttribute(palette, mode, prefersDark)` and `data-scheme` from `isDarkVariant()`. For the default palette (harbor) in auto mode the attribute is removed and `:root` + `prefers-color-scheme` take over — so the `light`/`dark` blocks must stay the harbor variants.\n4. Delete the colour declarations from `:root`, `@media (prefers-color-scheme: dark) :root`, `html[data-theme=light|dark]` in `style.css` and `menubar.css`. Keep non-colour vars (radius, shadow, transition).\n5. After every re-solve, copy `canvas`, `surface`, `brand`, `accent`, `text` of each block into `VARIANTS` in `themes.js` (previews must match the stylesheet), and keep the light/dark tag of each theme in sync with `VARIANTS[v].scheme`.\n6. During migration keep aliases: `--color-primary: var(--color-brand); --color-bg: var(--color-canvas); --color-muted: var(--color-text-muted);`.",

            "findings": "- **link 2.9:1 on canvas (light)** < 4.5 → link darkens; brand stays for button fills. Same in nordLight.\n- **textMuted 3.2:1 (light)** < 4.5 → darkens to ~55%.\n- **borderStrong 1.4:1 / 1.8:1** < 3 → input borders become visibly darker/lighter. Plain `border` has no floor (decorative divider) — deliberate.\n- **White text on `.button` (#3498db) ≈ 3.1:1** < 4.5; brand is an anchor so not solved — consider a darker brand or a `brandStrong` fill token (must then also be added to `TOKENS` in themes.js). Same applies to light `secondary` and the pastel brands of nord/dracula.\n- **Previous solve (current themes.css) is partly invalid:**\n  - sepia / sepiaDark / dracula / draculaLight `brand-hover` and `link` chroma 0.36–0.67 (far out of sRGB);\n  - solarizedDark / dracula `heading` chroma 0.33 / 0.42;\n  - draculaLight `text` L −6.9% and `link` L −15% (themes.js clamps the preview to 0%);\n  - dark `text` L 70% teal instead of 91% neutral;\n  - `text-muted` hue ≈357° in every theme;\n  - stark: `border-strong` weaker than `border` in both schemes.\n  Causes: derived outputs were not seeded per theme (they inherited blue-hue / dark-text light seeds, so `lock H` and contrast terms diverged), tuning vars were not `locked` (solver moved `textL`, `headingC`), no hue lock on the text family, single contrast floors for stark. All four are fixed in this scenario; re-solve and re-sync `VARIANTS`.\n- Merged `#007bff/#0072ff` (plugin progress, auth banner, app-directory accent) into brand family (ΔE ≈ 0.08) — aggressive; role confirmed as 'brand'.\n- Dark active-tab blues `#5dade2`/`#9ecbff` not tokenised; candidate `linkActive`.\n- Text family hue taken from orientation `ink`/`coolGray`, not from the grays.\n- Dark theme exists twice in CSS (media + attribute); emitter reproduces both.\n- `#e0e0e0` is used as a light border and as dark text — split into separate tokens.\n- Status anchors (danger/success/warning) are shared by light, dark and sepia; palettes differ mainly by canvas, surface, brand and text (as noted in themes.js).",

                "css": "body { margin: 0; padding: 20px; font: 14px/1.5 system-ui, sans-serif; background: var(--color-canvas, #f4f6f9); color: var(--color-text, #333); }\nh2 { margin: 0 0 4px; font-size: 20px; color: var(--color-heading, #2c3e50); }\nh3 { margin: 16px 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--color-text-muted, #7f8c8d); }\np { margin: 6px 0; }\n.muted { color: var(--color-text-muted, #7f8c8d); }\na { color: var(--color-link, #3498db); }\na.hover { text-decoration: none; }\nhr { border: 0; border-top: 1px solid var(--color-border, #e1e4e8); margin: 12px 0; }\n.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }\n.card { background: var(--color-surface, #fff); border: 1px solid var(--color-border, #e1e4e8); border-radius: 8px; padding: 12px; margin: 8px 0; }\n.card .card { background: var(--color-surface-alt, #f8f9fa); }\ninput { background: var(--color-surface, #fff); color: var(--color-text, #333); border: 1px solid var(--color-border-strong, #d0d7de); border-radius: 6px; padding: 6px 8px; }\ninput::placeholder { color: var(--color-text-muted, #7f8c8d); }\ninput.focus { outline: none; border-color: var(--color-brand, #3498db); box-shadow: 0 0 0 3px color-mix(in oklch, var(--color-brand, #3498db) 25%, transparent); }\n.btn { display: inline-block; border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 600; color: #fff; background: var(--color-brand, #3498db); }\n.btn.hover { background: var(--color-brand-hover, #2980b9); }\n.btn.secondary { background: var(--color-secondary, #95a5a6); }\n.btn.secondary.hover { background: var(--color-secondary-hover, #7f8c8d); }\n.btn.danger { background: var(--color-danger, #e74c3c); }\n.btn.danger.hover { background: var(--color-danger-hover, #c0392b); }\n.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; color: #fff; font-size: 12px; }\n.b-brand { background: var(--color-brand, #3498db); }\n.b-accent { background: var(--color-accent, #8e44ad); }\n.b-warn { background: var(--color-warning, #e67e22); }\n.b-ok { background: var(--color-success, #27ae60); }\n.b-danger { background: var(--color-danger, #e74c3c); }\n.alert { background: var(--color-surface-alt, #f8f9fa); border: 1px solid var(--color-border, #e1e4e8); border-left: 4px solid var(--color-warning, #e67e22); border-radius: 6px; padding: 8px 12px; margin: 6px 0; }\n.alert.danger { border-left-color: var(--color-danger, #e74c3c); }\n.sw { display: inline-block; width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--color-border-strong, #d0d7de); }",
                "html": "<h2>Cognotik<\/h2>\n<p>Body text on <code>canvas<\/code>. <span class=\"muted\">Muted secondary text — timestamps, hints, captions.<\/span><\/p>\n<p>A <a href=\"#\">link<\/a> on the brand hue, and a <a class=\"hover\" href=\"#\">hovered link<\/a>.<\/p>\n<hr>\n<h3>Surfaces &amp; controls<\/h3>\n<div class=\"card\"><b>surface<\/b> — app card <span class=\"muted\">· decorative border<\/span>\n  <div class=\"card\"><b>surfaceAlt<\/b> — settings card\n    <div class=\"row\"><input placeholder=\"Search applications…\"><input class=\"focus\" value=\"Focused input\"><\/div>\n  <\/div>\n<\/div>\n<h3>Actions (rest / hover)<\/h3>\n<div class=\"row\"><span class=\"btn\">Launch Session<\/span><span class=\"btn hover\">Launch Session<\/span><span class=\"btn secondary\">Cancel<\/span><span class=\"btn secondary hover\">Cancel<\/span><span class=\"btn danger\">Delete<\/span><span class=\"btn danger hover\">Delete<\/span><\/div>\n<h3>Status<\/h3>\n<div class=\"row\"><span class=\"badge b-brand\">brand<\/span><span class=\"badge b-accent\">accent<\/span><span class=\"badge b-warn\">warning<\/span><span class=\"badge b-ok\">success<\/span><span class=\"badge b-danger\">danger<\/span><\/div>\n<div class=\"alert\"><b>Budget warning<\/b> — <span class=\"muted\">session cost is above 80% of the limit.<\/span> <a href=\"#\">Review usage<\/a><\/div>\n<div class=\"alert danger\"><b>Session failed<\/b> — <span class=\"muted\">the model returned an error.<\/span> <a href=\"#\">Retry<\/a><\/div>\n<h3>Tokens (themes.js TOKENS order)<\/h3>\n<div class=\"row\"><span class=\"sw\" title=\"canvas\" style=\"background:var(--color-canvas)\"><\/span><span class=\"sw\" title=\"surface\" style=\"background:var(--color-surface)\"><\/span><span class=\"sw\" title=\"surface-alt\" style=\"background:var(--color-surface-alt)\"><\/span><span class=\"sw\" title=\"border\" style=\"background:var(--color-border)\"><\/span><span class=\"sw\" title=\"border-strong\" style=\"background:var(-
