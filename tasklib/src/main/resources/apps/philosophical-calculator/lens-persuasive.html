<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persuasive Essay · Philosophical Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
    <h1 id="lens-title">🎯 Persuasive Essay</h1>
    <p class="subtitle" id="lens-blurb"></p>
</header>
<nav class="tab-nav" id="lens-nav" aria-label="Output lenses"></nav>
<main id="lens-root"></main>
<script src="/lib/marked.min.js"></script>
<script type="module">
    import {initLensPage} from './js/lensPage.js';

    initLensPage({
        lensId: 'persuasive-essay',
        icon: '🎯',
        title: 'Persuasive Essay',
        blurb: 'A rhetorically structured argument. Iterate with your own notes; the result still ' +
            'feeds back into Update Article.',
        source: {file: 'persuasive.md', mono: false},
        notesFile: 'persuasive-notes.md',
        preview: {kind: 'markdown'},
        ops: {
            generate: 'ops/persuasive_op.md',
            update: 'ops/persuasive_update_op.md'
        }
    });
</script>
</body>
</html>
