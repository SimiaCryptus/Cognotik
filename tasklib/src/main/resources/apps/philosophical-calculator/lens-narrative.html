<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrative Story · Philosophical Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
    <h1 id="lens-title">📖 Narrative Story</h1>
    <p class="subtitle" id="lens-blurb"></p>
</header>
<nav class="tab-nav" id="lens-nav" aria-label="Output lenses"></nav>
<main id="lens-root"></main>
<script src="/lib/marked.min.js"></script>
<script type="module">
    import {initLensPage} from './js/lensPage.js';

    initLensPage({
        lensId: 'narrative-story',
        icon: '📖',
        title: 'Narrative Story',
        blurb: 'A dramatized retelling with inline illustrations. Use the notes file to steer tone, ' +
            'cast and pacing between passes.',
        source: {file: 'narrative.md', mono: false},
        notesFile: 'narrative-notes.md',
        preview: {kind: 'markdown'},
        ops: {
            generate: 'ops/narrative_op.md',
            update: 'ops/narrative_update_op.md'
        }
    });
</script>
</body>
</html>
