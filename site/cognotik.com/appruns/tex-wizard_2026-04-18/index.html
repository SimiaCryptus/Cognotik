<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeX Wizard — Overview</title>
<script src="marked.min.js"></script>
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
--color-bg: #0f1117;
--color-surface: #1a1d27;
--color-surface-alt: #222633;
--color-border: #2e3345;
--color-text: #e0e0e6;
--color-text-muted: #9a9bb0;
--color-accent: #6c8cff;
--color-accent-hover: #8da6ff;
--color-accent-glow: rgba(108, 140, 255, 0.25);
--color-cta: #ff6c6c;
--color-cta-hover: #ff8a8a;
--color-cta-glow: rgba(255, 108, 108, 0.3);
--radius: 10px;
--radius-lg: 16px;
--shadow: 0 2px 12px rgba(0,0,0,0.3);
--sticky-height: 64px;
--max-width: 860px;
}
html { scroll-behavior: smooth; }
body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
background: var(--color-bg);
color: var(--color-text);
line-height: 1.7;
}
/* ── Sticky Launch Bar ── */
.launch-bar {
position: fixed;
top: 0;
left: 0;
right: 0;
z-index: 1000;
height: var(--sticky-height);
background: var(--color-surface);
border-bottom: 1px solid var(--color-border);
box-shadow: 0 4px 20px rgba(0,0,0,0.4);
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 clamp(16px, 4vw, 40px);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
}
.launch-bar-title {
font-size: 1.1rem;
font-weight: 600;
color: var(--color-text);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
display: flex;
align-items: center;
gap: 10px;
}
.launch-bar-title .icon {
font-size: 1.4rem;
}
.launch-bar-actions {
display: flex;
align-items: center;
gap: 12px;
flex-shrink: 0;
}
.btn-launch {
display: inline-flex;
align-items: center;
gap: 8px;
padding: 10px 24px;
border: none;
border-radius: var(--radius);
font-size: 0.95rem;
font-weight: 600;
cursor: pointer;
text-decoration: none;
transition: all 0.2s ease;
white-space: nowrap;
}
.btn-launch-primary {
position: absolute;
right: 5px;
top: 5px;
z-index: 10000;
background: var(--color-cta);
color: #fff;
box-shadow: 0 0 16px var(--color-cta-glow);
}
.btn-launch-primary:hover {
background: var(--color-cta-hover);
box-shadow: 0 0 24px var(--color-cta-glow);
transform: translateY(-1px);
}
.btn-launch-secondary {
background: var(--color-surface-alt);
color: var(--color-accent);
border: 1px solid var(--color-border);
}
.btn-launch-secondary:hover {
background: var(--color-border);
color: var(--color-accent-hover);
}
/* ── Hero Section ── */
.hero {
text-align: center;
padding: 60px 24px 40px;
max-width: var(--max-width);
margin: 0 auto;
}
.hero-icon {
font-size: 4rem;
margin-bottom: 16px;
display: block;
}
.hero h1 {
font-size: clamp(1.8rem, 5vw, 2.6rem);
font-weight: 700;
margin-bottom: 12px;
background: linear-gradient(135deg, var(--color-accent), var(--color-cta));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}
.hero p {
font-size: 1.15rem;
color: var(--color-text-muted);
max-width: 600px;
margin: 0 auto 28px;
}
.hero-cta {
display: inline-flex;
align-items: center;
gap: 10px;
padding: 14px 36px;
background: var(--color-cta);
color: #fff;
font-size: 1.1rem;
font-weight: 700;
border-radius: var(--radius-lg);
text-decoration: none;
box-shadow: 0 0 24px var(--color-cta-glow);
transition: all 0.2s ease;
}
.hero-cta:hover {
background: var(--color-cta-hover);
box-shadow: 0 0 36px var(--color-cta-glow);
transform: translateY(-2px);
}
.hero-cta .arrow {
font-size: 1.3rem;
transition: transform 0.2s ease;
}
.hero-cta:hover .arrow {
transform: translateX(4px);
}
/* ── README Content ── */
.readme-container {
max-width: var(--max-width);
margin: 0 auto;
padding: 0 24px 80px;
}
.readme-card {
background: var(--color-surface);
border: 1px solid var(--color-border);
border-radius: var(--radius-lg);
padding: clamp(24px, 5vw, 48px);
box-shadow: var(--shadow);
}
/* ── Markdown Rendered Styles ── */
.readme-card h1 {
font-size: 1.8rem;
font-weight: 700;
margin: 0 0 16px;
padding-bottom: 12px;
border-bottom: 2px solid var(--color-border);
color: var(--color-accent);
}
.readme-card h2 {
font-size: 1.4rem;
font-weight: 600;
margin: 36px 0 12px;
padding-bottom: 8px;
border-bottom: 1px solid var(--color-border);
color: var(--color-text);
}
.readme-card h3 {
font-size: 1.15rem;
font-weight: 600;
margin: 28px 0 8px;
color: var(--color-text);
}
.readme-card p {
margin: 0 0 14px;
color: var(--color-text-muted);
}
.readme-card ul, .readme-card ol {
margin: 0 0 16px 24px;
color: var(--color-text-muted);
}
.readme-card li {
margin-bottom: 6px;
}
.readme-card strong {
color: var(--color-text);
font-weight: 600;
}
.readme-card code {
background: var(--color-surface-alt);
border: 1px solid var(--color-border);
padding: 2px 7px;
border-radius: 5px;
font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
font-size: 0.88em;
color: var(--color-accent);
}
.readme-card pre {
background: var(--color-bg);
border: 1px solid var(--color-border);
border-radius: var(--radius);
padding: 20px;
overflow-x: auto;
margin: 0 0 18px;
}
.readme-card pre code {
background: none;
border: none;
padding: 0;
font-size: 0.85rem;
color: var(--color-text-muted);
line-height: 1.6;
}
.readme-card table {
width: 100%;
border-collapse: collapse;
margin: 0 0 18px;
font-size: 0.92rem;
}
.readme-card th {
background: var(--color-surface-alt);
color: var(--color-text);
font-weight: 600;
text-align: left;
padding: 10px 14px;
border: 1px solid var(--color-border);
}
.readme-card td {
padding: 10px 14px;
border: 1px solid var(--color-border);
color: var(--color-text-muted);
}
.readme-card tr:hover td {
background: var(--color-surface-alt);
}
.readme-card blockquote {
border-left: 4px solid var(--color-accent);
margin: 0 0 16px;
padding: 12px 20px;
background: var(--color-surface-alt);
border-radius: 0 var(--radius) var(--radius) 0;
color: var(--color-text-muted);
}
.readme-card hr {
border: none;
border-top: 1px solid var(--color-border);
margin: 32px 0;
}
.readme-card a {
color: var(--color-accent);
text-decoration: none;
}
.readme-card a:hover {
color: var(--color-accent-hover);
text-decoration: underline;
}
/* ── Loading State ── */
.loading {
text-align: center;
padding: 40px;
color: var(--color-text-muted);
}
.loading::after {
content: '';
display: inline-block;
width: 20px;
height: 20px;
border: 2px solid var(--color-border);
border-top-color: var(--color-accent);
border-radius: 50%;
animation: spin 0.8s linear infinite;
margin-left: 10px;
vertical-align: middle;
}
@keyframes spin {
to { transform: rotate(360deg); }
}
/* ── Footer ── */
.page-footer {
text-align: center;
padding: 24px;
color: var(--color-text-muted);
font-size: 0.85rem;
max-width: var(--max-width);
margin: 0 auto;
}
.page-footer a {
color: var(--color-accent);
text-decoration: none;
}
.page-footer a:hover {
text-decoration: underline;
}
/* ── Responsive ── */
@media (max-width: 600px) {
.launch-bar {
padding: 0 12px;
}
.launch-bar-title span.title-text {
display: none;
}
.btn-launch {
padding: 8px 16px;
font-size: 0.85rem;
}
.hero {
padding: 40px 16px 28px;
}
.readme-container {
padding: 0 12px 60px;
}
.readme-card {
padding: 20px;
}
.readme-card table {
font-size: 0.8rem;
}
.readme-card th, .readme-card td {
padding: 6px 8px;
}
}
</style>
<script src="../../assets/scripts/components/CognotikHeader.js" type="module"></script>
</head>
<body>
<cognotik-header current-page="tasks"></cognotik-header>
<!-- ── Sticky Launch Bar ── -->
<a href="app.html" class="btn-launch btn-launch-primary">📄 View Demo <span class="arrow">→</span></a>
<!-- ── Hero ── -->
<div class="hero">
<span class="hero-icon">📝</span>
<h1>TeX Wizard</h1>
<p>A LaTeX document authoring and rendering pipeline. Create, render, and build LaTeX documents with ERB templating, PDF compilation, and automatic rebuild capabilities.</p>
<a href="app.html" class="hero-cta">
View the Demo <span class="arrow">→</span>
</a>
</div>
<!-- ── README Content ── -->
<div class="readme-container" id="readme">
<div class="readme-card" id="readme-content">
<div class="loading">Loading documentation</div>
</div>
</div>
<footer class="page-footer">
<p>
<a href="app.html">View Demo</a> ·
<a href="https://github.com/cognotik" target="_blank" rel="noopener">GitHub</a>
</p>
</footer>
<script>
(function() {
'use strict';
var readmeEl = document.getElementById('readme-content');
// Attempt to fetch README.md and render it
fetch('README.md')
.then(function(res) {
if (!res.ok) throw new Error('README not found (HTTP ' + res.status + ')');
return res.text();
})
.then(function(md) {
if (window.marked && window.marked.parse) {
readmeEl.innerHTML = window.marked.parse(md);
} else {
// Fallback: show raw markdown in a pre block
readmeEl.innerHTML = '<pre style="white-space:pre-wrap;">' + md.replace(/</g, '&lt;') + '</pre>';
}
})
.catch(function(err) {
readmeEl.innerHTML =
'<p style="color:var(--color-text-muted);text-align:center;padding:40px;">' +
'⚠️ Could not load README.md — <a href="app.html">view the demo directly</a>.' +
'</p>';
console.warn('Failed to load README:', err);
});
})();
</script>
</body>
</html>
