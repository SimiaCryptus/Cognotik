ntrast\npoint danger         at #b00020 derived   # --theme-error\npoint success        at #0f8a4a derived   # --theme-success\n\n# background ramp: fixed lightness offsets from the canvas, one hue family\ndL canvas canvasDeep = deepStep\ndL canvas surface1   = surfaceStep\ndL canvas surface2   = altStep\ndL canvas codeBg     = codeStep\nlock H neutralAxis canvasDeep surface1 surface2 codeBg weight 0.3\nlock C neutralAxis canvasDeep surface2 codeBg weight 0.3\n\n# text family: hue + chroma from readingGray, lightness pinned / floored\nlock H readingGray text textMuted weight 0.5\nlock C readingGray text textMuted weight 0.5\nL text = textL\ncontrast text canvas        >= 7          # AAA body text\ncontrast text surface1      >= 7          # messages sit on panels\ncontrast textMuted canvas   >= mutedC     # AA: chips, captions, placeholders\ncontrast brand canvas       >= 4.5        # links, active tabs, modal title are brand-coloured text\n\n# filled controls: on-colour text\nlock H brand brandContrast weight 0.3\ncontrast brandContrast brand   >= 4.5\ncontrast accentContrast accent >= 4.5     # .cmd-button text on accent gradient\n\n# status colours: fixed semantic hues, contrast-floored\nH danger = 22 weight 0.5\ncontrast danger canvas >= 4.5\nH success = 155 weight 0.3\ncontrast success canvas >= 3              # LED + status label (large, uppercase)\n\n# ---- themes ---------------------------------------------------------------\ntheme light {\n  canvas      at #eef1f6\n  brand       at #0066ff\n  secondary   at #7b3fe4\n  accent      at #00857a\n  neutralAxis at oklch(90% 0.01 255)\n  readingGray at oklch(50% 0.03 263)\n}\ntheme dark {\n  canvas      at #14171c\n  brand       at #4c9aff\n  secondary   at #b46cff\n  accent      at #3fd18a\n  neutralAxis at oklch(25% 0.01 255)\n  readingGray at oklch(70% 0.015 250)\n  var surfaceStep = 0.038\n  var altStep = 0.071\n  var deepStep = -0.04\n  var codeStep = -0.017\n  var textL = 0.934\n  canvasDeep     at #0c0e12
