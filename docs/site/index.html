<!DOCTYPE html>
  <html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cognotik Documentation</title>
    <meta name="description" content="Browse Cognotik documentation: apps, modules, task types, cognitive modes and model providers." />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="topbar">
      <button id="menu-toggle" class="icon-btn" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <span class="bars" aria-hidden="true"></span>
      </button>

      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">◈</span>
        <span class="brand-text">
          <strong>Cognotik</strong>
          <em>Documentation</em>
        </span>
      </a>

      <div class="search">
        <label class="sr-only" for="search-input">Search documentation</label>
        <input id="search-input" type="search" placeholder="Search pages…  (press /)" autocomplete="off" spellcheck="false" />
        <button id="search-clear" class="icon-btn ghost" type="button" aria-label="Clear search" hidden>✕</button>
      </div>

      <button id="theme-toggle" class="icon-btn ghost" type="button" aria-label="Toggle color theme" title="Toggle theme">
        <span class="theme-icon" aria-hidden="true">◐</span>
      </button>
    </header>

    <div class="layout">
      <aside id="sidebar" class="sidebar" aria-label="Documentation navigation">
        <nav id="nav" class="nav">
          <p class="nav-loading">Loading menu…</p>
        </nav>
        <footer class="sidebar-footer">
          <span id="page-count">—</span>
        </footer>
      </aside>

      <div id="scrim" class="scrim" hidden></div>

      <main id="content" class="content" tabindex="-1">
        <p class="loading">Loading…</p>
      </main>

      <aside id="toc" class="toc" aria-label="On this page" hidden>
        <h2 class="toc-title">On this page</h2>
        <ol id="toc-list" class="toc-list"></ol>
      </aside>
    </div>

    <noscript>
      <p class="noscript">This documentation browser requires JavaScript. The raw markdown files are available in the
        <code>apps/</code>, <code>modules/</code>, <code>task-types/</code>, <code>cognitive-mode/</code>,
        <code>models/</code> and <code>devtools/</code> folders.</p>
    </noscript>

    <!-- marked must be a classic script (it is not an ES module) and must run before the app module -->
    <script src="marked.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
  </html>
