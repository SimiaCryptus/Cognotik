<!DOCTYPE html>
<html>
<head>
  <title>Generated Image Table</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; margin: 20px auto; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
    th { background: #f5f5f5; }
    img { max-width: 200px; max-height: 200px; border-radius: 4px; cursor: pointer; }
    img:hover { transform: scale(1.05); transition: transform 0.2s; }
  </style>
</head>
<body>
  <h1>Generated Image Table</h1>
  <table>
    <thead>
      <tr>
        <th></th>
        <th>Daylight</th>
        <th>Nighttime</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th>Cyberpunk City</th>
        <td><a href="cyberpunk_city_daylight.png" target="_blank"><img src="cyberpunk_city_daylight.png" alt="Cyberpunk City - Daylight" /></a></td>
        <td><a href="cyberpunk_city_nighttime.png" target="_blank"><img src="cyberpunk_city_nighttime.png" alt="Cyberpunk City - Nighttime" /></a></td>
      </tr>
      <tr>
        <th>Enchanted Forest</th>
        <td><a href="enchanted_forest_daylight.png" target="_blank"><img src="enchanted_forest_daylight.png" alt="Enchanted Forest - Daylight" /></a></td>
        <td><a href="enchanted_forest_nighttime.png" target="_blank"><img src="enchanted_forest_nighttime.png" alt="Enchanted Forest - Nighttime" /></a></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
