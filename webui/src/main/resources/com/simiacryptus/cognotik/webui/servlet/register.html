<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/favicon.svg" rel="icon"/>
    <title>Register — Cognotik</title>
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f4f6f9 0%, #e8edf5 50%, #dce3ed 100%);
            color: #333;
            line-height: 1.6;
            position: relative;
            overflow: hidden;
        }

        /* Decorative background shapes */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.07;
        }
        body::before {
            width: 600px;
            height: 600px;
            background: #8e44ad;
            top: -200px;
            left: -150px;
        }
        body::after {
            width: 500px;
            height: 500px;
            background: #3498db;
            bottom: -180px;
            right: -120px;
        }

        /* ===== Logo Area ===== */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
            z-index: 1;
        }
        .brand-logo-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        .brand img {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 2px 8px rgba(52,152,219,0.25));
        }
        .brand-name {
            font-size: 1.8em;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: -0.5px;
        }
        .brand-tagline {
            font-size: 0.92em;
            color: #7f8c8d;
            margin: 0;
        }

        /* ===== Card ===== */
        .login-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            padding: 36px 32px 28px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255,255,255,0.6);
            width: 100%;
            max-width: 440px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .login-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin: 0 0 6px;
            font-size: 1.5em;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            color: #95a5a6;
            font-size: 0.9em;
            margin: 0 0 24px;
        }

        /* ===== Form ===== */
        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #dde1e7;
            border-radius: 8px;
            font-size: 0.98em;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: #fafbfc;
            color: #333;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
            background: #fff;
        }
        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #b0b8c1;
        }

        /* ===== Button ===== */
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #8e44ad 0%, #7d3c98 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(142, 68, 173, 0.25);
            margin-top: 4px;
        }
        button[type="submit"]:hover {
            background: linear-gradient(135deg, #7d3c98 0%, #6c3483 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(142, 68, 173, 0.35);
        }
        button[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(142, 68, 173, 0.2);
        }
        button[type="submit"]:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.4);
        }

        /* ===== Error ===== */
        .error {
            color: #c0392b;
            background: linear-gradient(135deg, #fdf2f2 0%, #fce8e8 100%);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 0.9em;
            border: 1px solid #f5c6cb;
            font-weight: 500;
        }

        /* ===== Password Strength ===== */
        .password-strength {
            margin-top: 6px;
            font-size: 0.82em;
            min-height: 1.2em;
            transition: all 0.2s ease;
        }
        .strength-meter {
            height: 5px;
            border-radius: 3px;
            background: #e9ecef;
            margin-top: 8px;
            overflow: hidden;
        }
        .strength-meter-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.35s ease, background-color 0.35s ease;
            width: 0%;
        }
        .strength-weak { color: #e74c3c; }
        .strength-fair { color: #f39c12; }
        .strength-good { color: #27ae60; }
        .strength-strong { color: #3498db; }

        /* ===== Links ===== */
        .links {
            text-align: center;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #eef0f3;
        }
        .links a {
            color: #8e44ad;
            text-decoration: none;
            font-size: 0.92em;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .links a:hover {
            color: #6c3483;
            text-decoration: underline;
        }

        /* ===== Features List ===== */
        .features {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
            z-index: 1;
            flex-wrap: wrap;
        }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82em;
            color: #7f8c8d;
        }
        .feature-icon {
            font-size: 1.1em;
        }

        /* ===== Footer ===== */
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.78em;
            color: #95a5a6;
            z-index: 1;
        }
        .footer-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .footer img {
            width: 16px;
            height: 16px;
            opacity: 0.5;
        }
         /* ===== Theme Selector ===== */
         .theme-selector-container {
             position: fixed;
             top: 16px;
             right: 16px;
             z-index: 10;
             display: flex;
             align-items: center;
             gap: 8px;
             background: rgba(255, 255, 255, 0.85);
             backdrop-filter: blur(8px);
             padding: 6px 10px;
             border-radius: 8px;
             box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
             border: 1px solid rgba(255, 255, 255, 0.6);
         }
         .theme-selector-container label {
             margin: 0;
             font-size: 0.78em;
             color: #7f8c8d;
             font-weight: 600;
         }
         #theme-selector {
             padding: 4px 8px;
             border: 1px solid #dde1e7;
             border-radius: 6px;
             font-size: 0.85em;
             font-family: inherit;
             background: #fff;
             color: #333;
             cursor: pointer;
         }
         #theme-selector:focus {
             outline: none;
             border-color: #8e44ad;
             box-shadow: 0 0 0 2px rgba(142, 68, 173, 0.2);
         }
         /* ===== Dark Mode (explicit data-theme="dark") ===== */
         [data-theme="dark"] body {
             background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1a2030 100%);
             color: #e0e0e0;
         }
         [data-theme="dark"] body::before { opacity: 0.04; }
         [data-theme="dark"] body::after { opacity: 0.04; }
         [data-theme="dark"] .brand-name { color: #e0e0e0; }
         [data-theme="dark"] .brand-tagline { color: #777; }
         [data-theme="dark"] .login-container {
             background: rgba(30, 34, 46, 0.95);
             border-color: rgba(255,255,255,0.06);
             box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.2);
         }
         [data-theme="dark"] .login-container:hover {
             box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.25);
         }
         [data-theme="dark"] h2 { color: #e0e0e0; }
         [data-theme="dark"] .subtitle { color: #666; }
         [data-theme="dark"] label { color: #ccc; }
         [data-theme="dark"] input[type="text"],
         [data-theme="dark"] input[type="password"] {
             background: #2a2e3a;
             border-color: #3a3f4c;
             color: #e0e0e0;
         }
         [data-theme="dark"] input[type="text"]:focus,
         [data-theme="dark"] input[type="password"]:focus {
             border-color: #8e44ad;
             background: #2e3340;
             box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.2);
         }
         [data-theme="dark"] input[type="text"]::placeholder,
         [data-theme="dark"] input[type="password"]::placeholder {
             color: #555;
         }
         [data-theme="dark"] .error {
             background: linear-gradient(135deg, #2d1a1a 0%, #331e1e 100%);
             color: #e74c3c;
             border-color: #5a2a2a;
         }
         [data-theme="dark"] .strength-meter { background: #333; }
         [data-theme="dark"] .links { border-top-color: #2a2e3a; }
         [data-theme="dark"] .links a { color: #bb8fce; }
         [data-theme="dark"] .links a:hover { color: #d2b4de; }
         [data-theme="dark"] .feature-item { color: #666; }
         [data-theme="dark"] .footer { color: #555; }
         [data-theme="dark"] .footer img { opacity: 0.3; }
         [data-theme="dark"] button[type="submit"] {
             box-shadow: 0 4px 12px rgba(142, 68, 173, 0.15);
         }
         [data-theme="dark"] button[type="submit"]:hover {
             box-shadow: 0 6px 20px rgba(142, 68, 173, 0.25);
         }
         [data-theme="dark"] .theme-selector-container {
             background: rgba(30, 34, 46, 0.85);
             border-color: rgba(255, 255, 255, 0.06);
             box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
         }
         [data-theme="dark"] .theme-selector-container label { color: #888; }
         [data-theme="dark"] #theme-selector {
             background: #2a2e3a;
             border-color: #3a3f4c;
             color: #e0e0e0;
         }
         [data-theme="dark"] #theme-selector:focus {
             border-color: #8e44ad;
             box-shadow: 0 0 0 2px rgba(142, 68, 173, 0.3);
         }

         /* ===== Dark Mode (auto via prefers-color-scheme when no explicit theme set) ===== */
        @media (prefers-color-scheme: dark) {
             :root:not([data-theme="light"]) body {
                background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #1a2030 100%);
                color: #e0e0e0;
            }
             :root:not([data-theme="light"]) body::before { opacity: 0.04; }
             :root:not([data-theme="light"]) body::after { opacity: 0.04; }

             :root:not([data-theme="light"]) .brand-name { color: #e0e0e0; }
             :root:not([data-theme="light"]) .brand-tagline { color: #777; }

             :root:not([data-theme="light"]) .login-container {
                background: rgba(30, 34, 46, 0.95);
                border-color: rgba(255,255,255,0.06);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.2);
            }
             :root:not([data-theme="light"]) .login-container:hover {
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.25);
            }

             :root:not([data-theme="light"]) h2 { color: #e0e0e0; }
             :root:not([data-theme="light"]) .subtitle { color: #666; }

             :root:not([data-theme="light"]) label { color: #ccc; }

             :root:not([data-theme="light"]) input[type="text"],
             :root:not([data-theme="light"]) input[type="password"] {
                background: #2a2e3a;
                border-color: #3a3f4c;
                color: #e0e0e0;
            }
             :root:not([data-theme="light"]) input[type="text"]:focus,
             :root:not([data-theme="light"]) input[type="password"]:focus {
                border-color: #8e44ad;
                background: #2e3340;
                box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.2);
            }
             :root:not([data-theme="light"]) input[type="text"]::placeholder,
             :root:not([data-theme="light"]) input[type="password"]::placeholder {
                color: #555;
            }

             :root:not([data-theme="light"]) .error {
                background: linear-gradient(135deg, #2d1a1a 0%, #331e1e 100%);
                color: #e74c3c;
                border-color: #5a2a2a;
            }

             :root:not([data-theme="light"]) .strength-meter { background: #333; }

             :root:not([data-theme="light"]) .links { border-top-color: #2a2e3a; }
             :root:not([data-theme="light"]) .links a { color: #bb8fce; }
             :root:not([data-theme="light"]) .links a:hover { color: #d2b4de; }

             :root:not([data-theme="light"]) .feature-item { color: #666; }

             :root:not([data-theme="light"]) .footer { color: #555; }
             :root:not([data-theme="light"]) .footer img { opacity: 0.3; }

             :root:not([data-theme="light"]) button[type="submit"] {
                box-shadow: 0 4px 12px rgba(142, 68, 173, 0.15);
            }
             :root:not([data-theme="light"]) button[type="submit"]:hover {
                box-shadow: 0 6px 20px rgba(142, 68, 173, 0.25);
            }
             :root:not([data-theme="light"]) .theme-selector-container {
                 background: rgba(30, 34, 46, 0.85);
                 border-color: rgba(255, 255, 255, 0.06);
             }
             :root:not([data-theme="light"]) .theme-selector-container label { color: #888; }
             :root:not([data-theme="light"]) #theme-selector {
                 background: #2a2e3a;
                 border-color: #3a3f4c;
                 color: #e0e0e0;
             }
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            body { padding: 16px; }
            .login-container { padding: 28px 22px 22px; }
            .brand img { width: 40px; height: 40px; }
            .brand-name { font-size: 1.5em; }
            .features { flex-direction: column; align-items: center; gap: 8px; }
             .theme-selector-container {
                 top: 8px;
                 right: 8px;
                 padding: 4px 8px;
             }
             .theme-selector-container label { display: none; }
        }

        /* ===== Animations ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand { animation: fadeInUp 0.5s ease-out; }
        .login-container { animation: fadeInUp 0.6s ease-out 0.1s both; }
        .features { animation: fadeInUp 0.5s ease-out 0.2s both; }
        .footer { animation: fadeInUp 0.5s ease-out 0.3s both; }
    </style>
</head>
<body>
     <div class="theme-selector-container">
         <label for="theme-selector">Theme:</label>
         <select id="theme-selector" aria-label="Select theme">
             <option value="auto">Auto</option>
             <option value="light">Light</option>
             <option value="dark">Dark</option>
         </select>
     </div>
    <div class="brand">
        <div class="brand-logo-row">
            <img alt="Cognotik Logo" src="/logo.svg">
            <span class="brand-name">Cognotik</span>
        </div>
        <p class="brand-tagline">AI-powered applications for analysis, creation, and automation</p>
    </div>

    <div class="login-container">
        <h2>Create Account</h2>
        <p class="subtitle">Join Cognotik and start building with AI</p>
        <!--ERROR_BLOCK-->
        <form method="POST" action="/login/" autocomplete="on">
            <input type="hidden" name="action" value="register">
            <!--TARGET_HIDDEN_FIELD-->
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" placeholder="Choose a username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Create a strong password" required>
                <div class="strength-meter"><div class="strength-meter-fill" id="strengthMeterFill"></div></div>
                <div class="password-strength" id="passwordStrength"></div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Re-enter your password" required>
                <div class="password-strength" id="confirmMatch"></div>
            </div>
            <button type="submit">Create Account</button>
        </form>
        <div class="links">
            <a href="<!--LOGIN_LINK-->">Already have an account? <strong>Sign in</strong></a>
        </div>
    </div>

    <div class="features">
        <div class="feature-item">
            <span class="feature-icon">🔒</span>
            <span>Secure & Private</span>
        </div>
        <div class="feature-item">
            <span class="feature-icon">⚡</span>
            <span>Instant Setup</span>
        </div>
        <div class="feature-item">
            <span class="feature-icon">🤖</span>
            <span>AI-Powered Tools</span>
        </div>
    </div>

    <div class="footer">
        <div class="footer-content">
            <img alt="Cognotik" src="/logo.svg">
            <span>Cognotik &copy; 2026 SimiaCryptus Software</span>
        </div>
    </div>

    <script>
    (function() {
      var pw = document.getElementById('password');
      var cpw = document.getElementById('confirmPassword');
      var strengthEl = document.getElementById('passwordStrength');
      var meterFill = document.getElementById('strengthMeterFill');
      var matchEl = document.getElementById('confirmMatch');
      function evaluateStrength(p) {
        if (!p) return { score: 0, label: '', cls: '', tips: [] };
        var score = 0; var tips = [];
        if (p.length >= 6) score++; else tips.push('6+ characters recommended');
        if (p.length >= 10) score++;
        if (/[a-z]/.test(p) && /[A-Z]/.test(p)) score++; else if (p.length > 0) tips.push('mix upper & lowercase');
        if (/\d/.test(p)) score++; else tips.push('add a number');
        if (/[^a-zA-Z0-9]/.test(p)) score++; else tips.push('add a special character');
        if (score <= 1) return { score: score, label: 'Weak', cls: 'strength-weak', tips: tips };
        if (score <= 2) return { score: score, label: 'Fair', cls: 'strength-fair', tips: tips };
        if (score <= 3) return { score: score, label: 'Good', cls: 'strength-good', tips: tips };
        return { score: score, label: 'Strong', cls: 'strength-strong', tips: [] };
      }
      function update() {
        var r = evaluateStrength(pw.value);
        if (!pw.value) { strengthEl.textContent = ''; meterFill.style.width = '0%'; meterFill.style.backgroundColor = '#eee'; }
        else {
          var pct = Math.min(100, (r.score / 5) * 100);
          var colors = { 'strength-weak': '#e74c3c', 'strength-fair': '#f39c12', 'strength-good': '#27ae60', 'strength-strong': '#3498db' };
          meterFill.style.width = pct + '%';
          meterFill.style.backgroundColor = colors[r.cls] || '#eee';
          var tip = r.tips.length > 0 ? ' \u2014 ' + r.tips.slice(0, 2).join(', ') : '';
          strengthEl.innerHTML = '<span class="' + r.cls + '">' + r.label + tip + '</span>';
        }
        if (cpw.value && pw.value !== cpw.value) {
          matchEl.innerHTML = '<span class="strength-weak">\u2717 Passwords do not match</span>';
        } else if (cpw.value && pw.value === cpw.value) {
          matchEl.innerHTML = '<span class="strength-good">\u2713 Passwords match</span>';
        } else { matchEl.textContent = ''; }
      }
      pw.addEventListener('input', update);
      cpw.addEventListener('input', update);
    })();
    </script>
</body>
</html>
