<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link href="/favicon.svg" rel="icon"/>
    <title>Register — Cognotik</title>
    <!-- Central theme system: tokens, manifest, then manager (order matters) -->
    <link href="/themes.css" id="theme-stylesheet" rel="stylesheet">
    <script src="/themes.js"></script>
    <script src="/modules/theme.js"></script>
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg,
                var(--color-canvas) 0%,
                color-mix(in srgb, var(--color-canvas) 94%, var(--color-brand)) 60%,
                color-mix(in srgb, var(--color-canvas) 88%, var(--color-brand)) 100%);
            color: var(--color-text);
            line-height: 1.6;
            position: relative;
            overflow: hidden;
        }

        /* Decorative background shapes */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.07;
        }
        body::before {
            width: 600px;
            height: 600px;
            background: var(--color-accent);
            top: -200px;
            left: -150px;
        }
        body::after {
            width: 500px;
            height: 500px;
            background: var(--color-brand);
            bottom: -180px;
            right: -120px;
        }
        html[data-scheme="dark"] body::before,
        html[data-scheme="dark"] body::after { opacity: 0.04; }

        /* ===== Logo Area ===== */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
            z-index: 1;
        }
        .brand-logo-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        .brand img {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 2px 8px color-mix(in srgb, var(--color-brand) 25%, transparent));
        }
        .brand-name {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--color-heading);
            letter-spacing: -0.5px;
        }
        .brand-tagline {
            font-size: 0.92em;
            color: var(--color-text-muted);
            margin: 0;
        }

        /* ===== Card ===== */
        .login-container {
            position: relative;
            z-index: 1;
            background: color-mix(in srgb, var(--color-surface) 97%, transparent);
            backdrop-filter: blur(12px);
            padding: 36px 32px 28px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--color-border);
            width: 100%;
            max-width: 440px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .login-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
        }
        html[data-scheme="dark"] .login-container {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        html[data-scheme="dark"] .login-container:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.25);
        }

        h2 {
            text-align: center;
            color: var(--color-heading);
            margin: 0 0 6px;
            font-size: 1.5em;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            color: var(--color-text-muted);
            font-size: 0.9em;
            margin: 0 0 24px;
        }

        /* ===== Form ===== */
        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--color-text);
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--color-border-strong);
            border-radius: 8px;
            font-size: 0.98em;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            background: var(--color-surface-alt);
            color: var(--color-text);
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--color-brand);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-brand) 15%, transparent);
            background: var(--color-surface);
        }
        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: var(--color-text-muted);
            opacity: 0.7;
        }

        /* ===== Button ===== */
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: var(--color-brand);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px color-mix(in srgb, var(--color-brand) 25%, transparent);
            margin-top: 4px;
        }
        button[type="submit"]:hover {
            background: var(--color-brand-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px color-mix(in srgb, var(--color-brand) 35%, transparent);
        }
        button[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px color-mix(in srgb, var(--color-brand) 20%, transparent);
        }
        button[type="submit"]:focus {
            outline: none;
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-brand) 40%, transparent);
        }

        /* ===== Error ===== */
        .error {
            color: var(--color-danger);
            background: color-mix(in srgb, var(--color-danger) 10%, var(--color-surface));
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 0.9em;
            border: 1px solid color-mix(in srgb, var(--color-danger) 35%, transparent);
            font-weight: 500;
        }

        /* ===== Password Strength ===== */
        .password-strength {
            margin-top: 6px;
            font-size: 0.82em;
            min-height: 1.2em;
            transition: all 0.2s ease;
        }
        .strength-meter {
            height: 5px;
            border-radius: 3px;
            background: var(--color-border);
            margin-top: 8px;
            overflow: hidden;
        }
        .strength-meter-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.35s ease, background-color 0.35s ease;
            width: 0%;
        }
        .strength-weak { color: var(--color-danger); }
        .strength-fair { color: var(--color-warning); }
        .strength-good { color: var(--color-success); }
        .strength-strong { color: var(--color-brand); }

        /* ===== Links ===== */
        .links {
            text-align: center;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }
        .links a {
            color: var(--color-link);
            text-decoration: none;
            font-size: 0.92em;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .links a:hover {
            text-decoration: underline;
        }

        /* ===== Features List ===== */
        .features {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
            z-index: 1;
            flex-wrap: wrap;
        }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82em;
            color: var(--color-text-muted);
        }
        .feature-icon {
            font-size: 1.1em;
        }

        /* ===== Footer ===== */
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.78em;
            color: var(--color-text-muted);
            z-index: 1;
        }
        .footer-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .footer img {
            width: 16px;
            height: 16px;
            opacity: 0.5;
        }
        html[data-scheme="dark"] .footer img { opacity: 0.3; }

        /* ===== Theme Selector ===== */
        .theme-selector-container {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            background: color-mix(in srgb, var(--color-surface) 85%, transparent);
            backdrop-filter: blur(8px);
            padding: 6px 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--color-border);
        }
        html[data-scheme="dark"] .theme-selector-container { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
        .theme-selector-container label {
            margin: 0;
            font-size: 0.78em;
            color: var(--color-text-muted);
            font-weight: 600;
        }
        .theme-selector-container select {
            padding: 4px 8px;
            border: 1px solid var(--color-border-strong);
            border-radius: 6px;
            font-size: 0.85em;
            font-family: inherit;
            background: var(--color-surface);
            color: var(--color-text);
            cursor: pointer;
        }
        .theme-selector-container select:focus {
            outline: none;
            border-color: var(--color-brand);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-brand) 25%, transparent);
        }
        .theme-selector-container select:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            body { padding: 16px; }
            .login-container { padding: 28px 22px 22px; }
            .brand img { width: 40px; height: 40px; }
            .brand-name { font-size: 1.5em; }
            .features { flex-direction: column; align-items: center; gap: 8px; }
            .theme-selector-container {
                top: 8px;
                right: 8px;
                padding: 4px 8px;
            }
            .theme-selector-container label { display: none; }
        }

        /* ===== Animations ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand { animation: fadeInUp 0.5s ease-out; }
        .login-container { animation: fadeInUp 0.6s ease-out 0.1s both; }
        .features { animation: fadeInUp 0.5s ease-out 0.2s both; }
        .footer { animation: fadeInUp 0.5s ease-out 0.3s both; }
    </style>
</head>
<body>
    <div class="theme-selector-container">
        <label for="palette-selector" id="palette-selector-label">Palette:</label>
        <select id="palette-selector" aria-label="Select color palette"></select>
        <label for="theme-selector">Theme:</label>
        <select id="theme-selector" aria-label="Select theme">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
    </div>
    <div class="brand">
        <div class="brand-logo-row">
            <img alt="Cognotik Logo" src="/logo.svg">
            <span class="brand-name">Cognotik</span>
        </div>
        <p class="brand-tagline">AI-powered applications for analysis, creation, and automation</p>
    </div>

    <div class="login-container">
        <h2>Create Account</h2>
        <p class="subtitle">Join Cognotik and start building with AI</p>
        <!--ERROR_BLOCK-->
        <form method="POST" action="/login/" autocomplete="on">
            <input type="hidden" name="action" value="register">
            <!--TARGET_HIDDEN_FIELD-->
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" placeholder="Choose a username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Create a strong password" required>
                <div class="strength-meter"><div class="strength-meter-fill" id="strengthMeterFill"></div></div>
                <div class="password-strength" id="passwordStrength"></div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Re-enter your password" required>
                <div class="password-strength" id="confirmMatch"></div>
            </div>
            <button type="submit">Create Account</button>
        </form>
        <div class="links">
            <a href="<!--LOGIN_LINK-->">Already have an account? <strong>Sign in</strong></a>
        </div>
    </div>

    <div class="features">
        <div class="feature-item">
            <span class="feature-icon">🔒</span>
            <span>Secure & Private</span>
        </div>
        <div class="feature-item">
            <span class="feature-icon">⚡</span>
            <span>Instant Setup</span>
        </div>
        <div class="feature-item">
            <span class="feature-icon">🤖</span>
            <span>AI-Powered Tools</span>
        </div>
    </div>

    <div class="footer">
        <div class="footer-content">
            <img alt="Cognotik" src="/logo.svg">
            <span>Cognotik &copy; 2026 SimiaCryptus Software</span>
        </div>
    </div>

    <script>
        // Bind the page's selectors to the central ThemeManager.
        (function() {
            document.addEventListener('DOMContentLoaded', function() {
                var paletteSel = document.getElementById('palette-selector');
                var paletteLbl = document.getElementById('palette-selector-label');
                var modeSel = document.getElementById('theme-selector');
                if (!window.ThemeManager) {
                    // Theme scripts unavailable: hide the (non-functional) controls.
                    var box = document.querySelector('.theme-selector-container');
                    if (box) box.style.display = 'none';
                    return;
                }
                if (ThemeManager.getManifest && ThemeManager.getManifest()) {
                    ThemeManager.bindPaletteSelector(paletteSel);
                } else {
                    if (paletteSel) paletteSel.style.display = 'none';
                    if (paletteLbl) paletteLbl.style.display = 'none';
                }
                ThemeManager.bindSelector(modeSel);
            });
            // Follow theme changes made in other tabs/windows while this page is open.
            window.addEventListener('storage', function(e) {
                if (!window.ThemeManager || !e.newValue) return;
                if (e.key === ThemeManager.PALETTE_STORAGE_KEY) ThemeManager.setPalette(e.newValue);
                if (e.key === ThemeManager.STORAGE_KEY) ThemeManager.setTheme(e.newValue);
            });
        })();
    </script>
    <script>
    (function() {
      var pw = document.getElementById('password');
      var cpw = document.getElementById('confirmPassword');
      var strengthEl = document.getElementById('passwordStrength');
      var meterFill = document.getElementById('strengthMeterFill');
      var matchEl = document.getElementById('confirmMatch');
      function evaluateStrength(p) {
        if (!p) return { score: 0, label: '', cls: '', tips: [] };
        var score = 0; var tips = [];
        if (p.length >= 6) score++; else tips.push('6+ characters recommended');
        if (p.length >= 10) score++;
        if (/[a-z]/.test(p) && /[A-Z]/.test(p)) score++; else if (p.length > 0) tips.push('mix upper & lowercase');
        if (/\d/.test(p)) score++; else tips.push('add a number');
        if (/[^a-zA-Z0-9]/.test(p)) score++; else tips.push('add a special character');
        if (score <= 1) return { score: score, label: 'Weak', cls: 'strength-weak', tips: tips };
        if (score <= 2) return { score: score, label: 'Fair', cls: 'strength-fair', tips: tips };
        if (score <= 3) return { score: score, label: 'Good', cls: 'strength-good', tips: tips };
        return { score: score, label: 'Strong', cls: 'strength-strong', tips: [] };
      }
      function update() {
        var r = evaluateStrength(pw.value);
        if (!pw.value) { strengthEl.textContent = ''; meterFill.style.width = '0%'; meterFill.style.backgroundColor = 'transparent'; }
        else {
          var pct = Math.min(100, (r.score / 5) * 100);
          var colors = {
            'strength-weak': 'var(--color-danger, #e74c3c)',
            'strength-fair': 'var(--color-warning, #f39c12)',
            'strength-good': 'var(--color-success, #27ae60)',
            'strength-strong': 'var(--color-brand, #3498db)'
          };
          meterFill.style.width = pct + '%';
          meterFill.style.backgroundColor = colors[r.cls] || 'transparent';
          var tip = r.tips.length > 0 ? ' \u2014 ' + r.tips.slice(0, 2).join(', ') : '';
          strengthEl.innerHTML = '<span class="' + r.cls + '">' + r.label + tip + '</span>';
        }
        if (cpw.value && pw.value !== cpw.value) {
          matchEl.innerHTML = '<span class="strength-weak">\u2717 Passwords do not match</span>';
        } else if (cpw.value && pw.value === cpw.value) {
          matchEl.innerHTML = '<span class="strength-good">\u2713 Passwords match</span>';
        } else { matchEl.textContent = ''; }
      }
      pw.addEventListener('input', update);
      cpw.addEventListener('input', update);
    })();
    </script>
</body>
</html>
