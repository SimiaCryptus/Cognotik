<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chromatic Designer — Interactive Layout Tool</title>
    <style>
      :root {
        --bg: #0f1115;
        --fg: #e8eaf0;
        --muted: #9aa0ad;
        --panel: #171a21;
        --border: #262a33;
        --accent: #7cc4ff;
        --warn: #ff8b8b;
        --good: #8bffb0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: 1fr 300px;
        grid-template-areas:
          'slice slice'
          'viewer side'
          'solver solver';
        gap: 0;
      }

      .slice-controls {
        grid-area: slice;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        align-items: flex-end;
        padding: 0.75rem 1rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      .control {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }

      .control label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      select,
      input[type='range'],
      input[type='number'] {
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.25rem 0.4rem;
        font-size: 0.8rem;
      }

      .control output {
        font-variant-numeric: tabular-nums;
        font-size: 0.8rem;
      }

      #viewer-wrap {
        grid-area: viewer;
        position: relative;
        overflow: hidden;
      }

      #viewer {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }

      #hint {
        position: absolute;
        top: 8px;
        left: 12px;
        font-size: 0.72rem;
        color: var(--muted);
        background: rgba(0, 0, 0, 0.4);
        padding: 0.3rem 0.5rem;
        border-radius: 6px;
        pointer-events: none;
        max-width: 60%;
      }

      aside {
        grid-area: side;
        background: var(--panel);
        border-left: 1px solid var(--border);
        overflow-y: auto;
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      aside h3 {
        margin: 0 0 0.5rem;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .inspector-row {
        font-size: 0.8rem;
        margin-bottom: 0.35rem;
      }

      .inspector-row .lbl {
        color: var(--muted);
      }

      .swatch-chip {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 4px;
        vertical-align: middle;
        border: 1px solid rgba(255, 255, 255, 0.15);
        margin-right: 0.35rem;
      }

      button {
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.35rem 0.6rem;
        font-size: 0.78rem;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button.primary {
        border-color: var(--accent);
        color: var(--accent);
      }

      button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .anchor-line,
      .group-line {
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.3rem;
        margin-bottom: 0.25rem;
      }

      .anchor-line input[type='number'] {
        width: 64px;
      }

      .residual {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .residual.bad {
        color: var(--warn);
      }

      .residual.good {
        color: var(--good);
      }

      .solver-controls {
        grid-area: solver;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 1rem;
        background: var(--panel);
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
      }

      .jbig {
        font-variant-numeric: tabular-nums;
        font-size: 1rem;
      }

      .jbig .v {
        color: var(--accent);
      }

      .tiny {
        font-size: 0.72rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="slice-controls">
      <div class="control">
        <label for="space">Space</label>
        <select id="space">
          <option value="OKLch">OKLch</option>
          <option value="OKLab">OKLab</option>
        </select>
      </div>
      <div class="control">
        <label for="xaxis">X axis</label>
        <select id="xaxis"></select>
      </div>
      <div class="control">
        <label for="yaxis">Y axis</label>
        <select id="yaxis"></select>
      </div>
      <div class="control">
        <label for="depthaxis">Depth axis</label>
        <select id="depthaxis"></select>
      </div>
      <div class="control">
        <label for="depth">Depth value</label>
        <input id="depth" type="range" min="0" max="1" step="0.01" value="0.6" />
        <output id="depth-out">0.60</output>
      </div>
      <div class="control">
        <label for="gamut">Gamut overlay</label>
        <input id="gamut" type="checkbox" checked />
      </div>
    </div>

    <div id="viewer-wrap">
      <canvas id="viewer"></canvas>
      <div id="hint">
        Click empty space to add a node. Drag a node to move it. Shift-click two nodes then "Link".
        Scroll over a node to change its depth.
      </div>
    </div>

    <aside id="side">
      <section id="inspector">
        <h3>Inspector</h3>
        <div id="inspector-body" class="tiny">Nothing selected.</div>
      </section>
      <section id="constraints">
        <h3>Constraints</h3>
        <div id="constraint-body" class="tiny">No constraints yet.</div>
      </section>
    </aside>

    <div class="solver-controls">
      <button id="solve" class="primary">Solve</button>
      <button id="step">Step</button>
      <button id="stop" disabled>Stop</button>
      <label class="tiny"><input type="checkbox" id="animate" checked /> animate</label>
      <label class="tiny"
        >iters <input id="iters" type="number" value="200" min="1" style="width: 70px"
      /></label>
      <div class="jbig">J = <span class="v" id="jval">—</span></div>
      <span class="tiny" id="solve-status"></span>
    </div>

    <script type="module" src="./designer.js"></script>
  </body>
</html>
